<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5573a">
<title>Christine &amp; Michaël — Invitation à notre Dot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">

<script>
/* ============================================================
   TEXTES À MODIFIER — tout se change ici, en français
   ============================================================ */
const SITE = {
  prenom1: "Christine",
  prenom2: "Michaël",
  initiales: "C&M",                       // sur le cachet de cire
  invitation: "Invitation à notre Dot",
  dateTexte: "12 Décembre 2026",
  dateISO: "2026-12-12T10:00:00Z",        // jour J (Abidjan = heure UTC)
  accueil: "Avec une immense joie, nous vous invitons à célébrer le jour où nos deux familles s'unissent.",
  boutonOuvrir: "Ouvrir notre invitation",
  photoAccueil: "hero.jpg",               // image d'arrière-plan de l'accueil

  histoireTitre: "Notre histoire",
  histoire: [
    ["La rencontre", "Un regard, un sourire, et le sentiment tranquille que quelque chose commençait."],
    ["Le premier rendez-vous", "Des heures passées à parler comme si le temps n'existait pas."],
    ["Le mariage traditionnel", "Le 12 décembre 2026, nos familles se réunissent pour bénir notre union."]
  ],

  galerieTitre: "Nos instants",
  photos: ["g1.jpg","g3.jpg","g2.jpg"],

  programmeTitre: "Le programme",
  programme: [
    ["10h00", "Accueil des invités", "Installation et retrouvailles"],
    ["11h00", "Cérémonie de la Dot", "Présentation des familles et remise de la dot"],
    ["13h00", "Séance photos", "Souvenirs en famille et entre amis"],
    ["14h30", "Repas", "Un moment de partage et de gourmandise"],
    ["17h00", "Remerciements", "Quelques mots avant de nous quitter"]
  ],

  lieuTitre: "Le lieu",
  lieuNom: "Espace B16",
  adresse: "8WH6+8M Abidjan, ABIDJAN",
  boutonItineraire: "Ouvrir l'itinéraire",

  rsvpTitre: "Confirmer ma présence",
  rsvpTexte: "Merci de nous répondre avant le",
  dateLimite: "15 Novembre 2026",
  formUrl: "https://forms.gle/VOTRE-LIEN",   // lien de votre formulaire
  boutonRsvp: "Je confirme ma présence",

  merci: "Merci de faire partie de notre histoire",
  hashtag: "#ChristineEtMichaël"
};
</script>

<style>
:root{--cr:#f6efe4;--cr2:#ecdfca;--tc:#b5573a;--tc2:#9c4529;--br:#3b2218}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cr);color:var(--br);font:300 1rem/1.75 Jost,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden;height:100svh}
h2{font:400 clamp(2rem,9vw,2.8rem)/1.15 'Bodoni Moda',serif}
.k{font:500 .72rem Cinzel,serif;letter-spacing:.3em;text-transform:uppercase;color:var(--tc);margin-bottom:12px}
section{padding:96px 26px;max-width:640px;margin:auto;text-align:center}
.alt{background:var(--cr2)}
.dk{background:var(--br);color:var(--cr)}
.orn{width:56px;height:1px;background:var(--tc);margin:22px auto 34px;position:relative}
.orn::after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;background:var(--tc);transform:translateX(-50%) rotate(45deg)}
.btn{display:inline-block;padding:16px 34px;background:var(--tc);color:var(--cr);font:500 .78rem Cinzel,serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border:0;border-radius:40px;cursor:pointer;transition:background 1s,opacity .5s}
.btn:hover,.btn:focus-visible{background:var(--tc2)}
.btn:focus-visible{outline:2px solid var(--br);outline-offset:3px}
.btn.o{background:none;border:1px solid var(--tc);color:var(--tc)}
.btn.o:hover{background:var(--tc);color:var(--cr)}

/* Révélations */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.6s ease,transform 1.6s ease}
.rv.in{opacity:1;transform:none}
.w{display:inline-block;opacity:0;transform:translateY(.7em);transition:opacity 1.3s ease,transform 1.3s ease}
.ti.in .w{opacity:1;transform:none}

/* Enveloppe */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#f6efe4,#e6d3b8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:72px;transition:opacity 1.1s ease}
#intro.out{opacity:0}
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/2}
.env>*{position:absolute}
.eb{inset:0;background:var(--tc2);border-radius:3px}
.ef{inset:0;background:var(--tc);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3}
.flap{left:0;right:0;top:0;height:56%;background:#c4684a;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transform:perspective(900px) rotateX(0);z-index:4;transition:transform 1.1s cubic-bezier(.6,0,.3,1),z-index 0s .45s}
.open .flap{transform:perspective(900px) rotateX(180deg);z-index:1}
.card{left:6%;right:6%;top:7%;height:84%;background:#fbf7ef;border:1px solid #e3d3ba;box-shadow:0 2px 14px rgba(59,34,24,.18);z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform 1.4s cubic-bezier(.5,0,.2,1) .9s}
.card .k{font-size:.6rem;margin:0}
.card .sc{font:400 clamp(1.5rem,7.5vw,2.1rem)/1.1 'Pinyon Script',cursive;margin:6px 0}
.card .d{font:400 .8rem 'Bodoni Moda',serif;color:var(--tc)}
.open .card{transform:translateY(-62%)}
.out .card{transform:translateY(-62%) scale(1.5);transition:transform 1.1s ease}
.seal{left:50%;top:56%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a4228,#4a2316 72%);box-shadow:0 3px 9px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.07);z-index:5;display:grid;place-items:center;font:400 clamp(1.3rem,7vw,1.9rem)/1 'Pinyon Script',cursive;color:#e9c9a8;transition:opacity .5s,transform .6s}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.8)}
.open .btn{opacity:0;pointer-events:none}

/* Accueil */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--cr);overflow:hidden;padding:64px 24px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 10%;transform:scale(1.1);will-change:transform}
.ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(59,34,24,.55),rgba(59,34,24,.3) 45%,rgba(59,34,24,.82))}
.hc{position:relative;max-width:440px}
.hero .k{color:#f0d3bd}
.nm{font:400 clamp(3.7rem,20vw,5.8rem)/.95 'Pinyon Script',cursive}
.amp{display:block;font:italic 400 1.5rem 'Bodoni Moda',serif;margin:6px 0}
.hd{font:400 1.05rem 'Bodoni Moda',serif;letter-spacing:.12em;margin:22px 0 10px}
.hero p.a{font-size:1rem;opacity:.92}
.cdw{display:flex;gap:10px;justify-content:center;margin-top:30px}
.cdw div{min-width:66px;padding:12px 6px;border:1px solid rgba(246,239,228,.4);background:rgba(59,34,24,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cdw b{display:block;font:400 1.7rem/1.1 'Bodoni Moda',serif}
.cdw small{font:.58rem Cinzel,serif;letter-spacing:.16em;text-transform:uppercase}

/* Frise */
.tl{position:relative;margin-top:8px;padding-left:38px;text-align:left}
.tl::before,.tlf{content:"";position:absolute;left:7px;top:6px;bottom:0;width:1px;background:rgba(59,34,24,.2)}
.tlf{background:var(--tc);transform-origin:top;transform:scaleY(0);width:2px;left:6.5px}
.ti2{position:relative;padding-bottom:46px}
.ti2::before{content:"";position:absolute;left:-38px;top:5px;width:15px;height:15px;border:1px solid var(--tc);border-radius:50%;background:var(--cr);transition:background 1.4s}
.ti2.in::before{background:var(--tc)}
.ti2 h3{font:400 1.4rem 'Bodoni Moda',serif;margin-bottom:4px}

/* Galerie */
.gal{display:grid;gap:20px}
.pl{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--cr2)}
.pl:nth-child(even){width:80%;margin-left:auto}
.pl:nth-child(3n){aspect-ratio:1}
.pl img{position:absolute;left:0;top:-12%;width:100%;height:124%;object-fit:cover;object-position:50% 20%;will-change:transform}

/* Programme */
.pg{display:grid;grid-template-columns:82px 1fr;gap:16px;text-align:left;padding:20px 0;border-bottom:1px solid rgba(59,34,24,.15)}
.pg time{font:400 1.3rem 'Bodoni Moda',serif;color:var(--tc)}
.pg h3{font:500 1rem Jost,sans-serif;letter-spacing:.02em}
.pg p{font-size:.92rem;opacity:.8}

/* Lieu & RSVP */
.lieu h3{font:400 1.7rem 'Bodoni Moda',serif}
.map{width:100%;height:280px;border:0;border-radius:4px;margin:28px 0;filter:sepia(.3) saturate(.85)}
.lim{font:400 1.5rem 'Bodoni Moda',serif;color:var(--tc);margin:6px 0 30px}

footer{padding:84px 24px calc(64px + env(safe-area-inset-bottom));text-align:center}
.ini{font:400 4rem/1 'Pinyon Script',cursive;color:#e0a98c;margin:24px 0 12px}
footer .k{color:#e0a98c;margin:0}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
.rv,.w{opacity:1;transform:none}
}
</style>
</head>
<body class="lock">

<div id="intro">
  <div class="env" id="env">
    <div class="eb"></div>
    <div class="card"><p class="k">Vous êtes invités</p><p class="sc" id="cn"></p><p class="d" id="cd"></p></div>
    <div class="ef"></div><div class="flap"></div><div class="seal" id="seal"></div>
  </div>
  <button class="btn" id="open"></button>
</div>

<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const R = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = t => t.split(' ').map((w,i)=>`<span class="w" style="transition-delay:${i*.18}s">${w}</span>`).join(' ');
const H = (k,t) => `<p class="k rv">${k}</p><h2 class="ti">${W(t)}</h2><div class="orn rv"></div>`;
const S = SITE;
const enc = encodeURIComponent(S.adresse);

document.title = `${S.prenom1} & ${S.prenom2} — ${S.invitation}`;
$('#cn').textContent = `${S.prenom1} & ${S.prenom2}`;
$('#cd').textContent = S.dateTexte;
$('#seal').textContent = S.initiales;
$('#open').textContent = S.boutonOuvrir;

$('#app').innerHTML = `
<header class="hero">
  <img src="${S.photoAccueil}" alt="${S.prenom1} et ${S.prenom2}" fetchpriority="high">
  <div class="ov"></div>
  <div class="hc">
    <p class="k rv">${S.invitation}</p>
    <h1 class="nm rv">${S.prenom1}<span class="amp">&amp;</span>${S.prenom2}</h1>
    <p class="hd rv">${S.dateTexte}</p>
    <p class="a rv">${S.accueil}</p>
    <div class="cdw rv">${['Jours','Heures','Minutes','Secondes'].map((l,i)=>`<div><b id="c${i}">00</b><small>${l}</small></div>`).join('')}</div>
  </div>
</header>

<section>
  ${H('De l\'un à l\'autre',S.histoireTitre)}
  <div class="tl"><div class="tlf"></div>
    ${S.histoire.map(([t,x])=>`<div class="ti2 rv"><h3>${t}</h3><p>${x}</p></div>`).join('')}
  </div>
</section>

<div class="alt"><section>
  ${H('En images',S.galerieTitre)}
  <div class="gal">${S.photos.map(p=>`<div class="pl rv"><img src="${p}" alt="" loading="lazy"></div>`).join('')}</div>
</section></div>

<section>
  ${H('La journée',S.programmeTitre)}
  ${S.programme.map(([h,t,x],i)=>`<div class="pg rv" style="transition-delay:${i*.1}s"><time>${h}</time><div><h3>${t}</h3><p>${x}</p></div></div>`).join('')}
</section>

<div class="alt"><section class="lieu">
  ${H('Où nous retrouver',S.lieuTitre)}
  <h3 class="rv">${S.lieuNom}</h3>
  <p class="rv">${S.adresse}</p>
  <iframe class="map rv" title="Carte" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${enc}&output=embed"></iframe>
  <a class="btn rv" href="https://www.google.com/maps/dir/?api=1&destination=${enc}" target="_blank" rel="noopener">${S.boutonItineraire}</a>
</section></div>

<section>
  ${H('Votre réponse',S.rsvpTitre)}
  <p class="rv">${S.rsvpTexte}</p>
  <p class="lim rv">${S.dateLimite}</p>
  <a class="btn rv" href="${S.formUrl}" target="_blank" rel="noopener">${S.boutonRsvp}</a>
</section>

<footer class="dk">
  <p class="k rv">${S.dateTexte}</p>
  <p class="ini rv">${S.initiales.replace('&',' & ')}</p>
  <h2 class="ti">${W(S.merci)}</h2>
  <div class="orn rv"></div>
  <p class="k rv">${S.hashtag}</p>
</footer>`;

/* Compte à rebours */
const cd = () => {
  let d = Math.max(0, new Date(S.dateISO) - Date.now()) / 1000 | 0;
  [86400,3600,60,1].forEach((u,i) => { $('#c'+i).textContent = String(d/u|0).padStart(2,'0'); d %= u; });
};
cd(); setInterval(cd, 1000);

/* Effets au défilement */
let tk = 0;
function fx(){
  tk = 0; const h = innerHeight;
  if(!R){
    document.querySelectorAll('.pl img').forEach(i=>{
      const r = i.parentNode.getBoundingClientRect();
      if(r.bottom>0 && r.top<h) i.style.transform = `translate3d(0,${((r.top+r.height/2-h/2)*-.1).toFixed(1)}px,0)`;
    });
    if(scrollY<h*1.2) $('.hero img').style.transform = `translate3d(0,${scrollY*.25}px,0) scale(1.1)`;
  }
  const r = $('.tl').getBoundingClientRect();
  $('.tlf').style.transform = `scaleY(${R?1:Math.max(0,Math.min(1,(h*.7-r.top)/r.height))})`;
}
addEventListener('scroll',()=>{ tk || (tk = requestAnimationFrame(fx)); },{passive:true});
addEventListener('resize',fx);

function start(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }),{threshold:.2,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv,.ti').forEach(e=>io.observe(e));
  fx();
}

/* Ouverture de l'enveloppe */
$('#open').onclick = () => {
  const intro = $('#intro');
  $('#open').disabled = true;
  intro.classList.add('open');
  setTimeout(()=>intro.classList.add('out'), R?300:2900);
  setTimeout(()=>{ intro.remove(); document.body.classList.remove('lock'); scrollTo(0,0); start(); }, R?700:4000);
};
</script>
</body>
</html>
